name: A2A interface tests
on:
  push:
    paths:
      - "a2a/**"
      - ".github/workflows/a2a-tests.yml"
  pull_request:
    paths:
      - "a2a/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bash -n a2a/activate.sh
      - run: bash -n a2a/activate-autonomous-sales.sh
      - run: node --check a2a/worker.mjs
      - run: node --check a2a/outreach.mjs
      - run: node --check a2a/connect-allagents.mjs
      - run: node --check a2a/commercial-autopilot.mjs
      - run: node a2a/commercial-autopilot.mjs
      - run: node --test a2a/worker.test.mjs
      - run: node a2a/outreach.mjs
